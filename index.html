<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JB Badminton Invitation</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f1e8;color:#25344d;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{width:min(520px,100%);background:#fffdf8;border-radius:28px;padding:34px 24px;box-shadow:0 12px 35px #00000012;text-align:center;overflow:hidden}
h1{font-size:34px;margin:8px 0 20px}
h2{font-size:28px;margin:8px 0 12px}
p{font-size:18px;line-height:1.5;color:#5d6570}
.racket{font-size:52px;margin-bottom:8px}
.question{font-size:22px;margin:18px 0 28px}
.buttons{display:flex;gap:14px;justify-content:center;position:relative;min-height:58px}
button{border:0;border-radius:14px;padding:16px 24px;font-size:17px;font-weight:700;cursor:pointer;transition:.18s}
.yes{background:#668f75;color:white}
.no{background:white;color:#25344d;border:1.5px solid #25344d;position:relative}
.message{height:30px;margin-top:12px;font-size:15px;color:#668f75;font-style:italic}
.hidden{display:none}
.dates{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:25px}
.date{background:white;border:1.5px solid #d8ddd7;border-radius:18px;padding:20px 10px;color:#4d765d}
.date strong{display:block;font-size:30px;color:#25344d;margin:5px}
.date:hover{transform:translateY(-3px);border-color:#668f75}
.confirm{padding-top:10px}
.check{width:62px;height:62px;border-radius:50%;background:#668f75;color:white;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 18px}
.small{font-size:16px}
.back{margin-top:24px;background:#eeeae0;color:#4c5664}
@media(max-width:420px){h1{font-size:29px}.dates{grid-template-columns:1fr 1fr}button{padding:14px 18px}}
</style>
</head>
<body>
<div class="card">
  <section id="page1">
    <div class="racket">🏸</div>
    <h1>I have a little proposal for you… 👀</h1>
    <p class="question">Wanna go JB with me for a<br><b>badminton + food day? 🏸🍜🇲🇾</b></p>
    <div class="buttons" id="buttons">
      <button class="yes" onclick="showDates()">YES, LET'S GO</button>
      <button class="no" id="noBtn" onclick="runAway(event)" ontouchstart="runAway(event)">NO</button>
    </div>
    <div class="message" id="message"></div>
  </section>

  <section id="page2" class="hidden">
    <div class="racket">🏸</div>
    <h2>Great! Choose our Sunday</h2>
    <p>Pick any Sunday in September.</p>
    <div class="dates">
      <button class="date" onclick="chooseDate('6 September')"><strong>6</strong>September</button>
      <button class="date" onclick="chooseDate('13 September')"><strong>13</strong>September</button>
      <button class="date" onclick="chooseDate('20 September')"><strong>20</strong>September</button>
      <button class="date" onclick="chooseDate('27 September')"><strong>27</strong>September</button>
    </div>
    <button class="back" onclick="backHome()">Back</button>
  </section>

  <section id="page3" class="hidden confirm">
    <div class="check">✓</div>
    <h1>It's a date!</h1>
    <p id="selected"></p>
    <p><b>JB + Badminton + Good Food</b><br>Perfect Sunday</p>
    <div style="font-size:52px;margin:20px">🇲🇾 🏸</div>
    <h2>See you in JB!</h2>
    <button class="back" onclick="backHome()">Start Again</button>
  </section>
</div>

<script>
const messages=[
  "Are you sure? 🥺",
  "Think again 😏",
  "You almost clicked YES 😂",
  "My lawyer says press YES 👀",
  "Error 404: NO not found 🤖",
  "The NO button is shy 🙈",
  "Nice try 😜",
  "You’re making me chase you 🏃‍♂️💨"
];
const noTexts=["NO","Nope","Still no?","Missed me?","Catch me!","Too slow 😝","Almost!","Try again!"];
let tries=0;

function runAway(e){
  if(e) e.preventDefault();

  const b=document.getElementById("noBtn");
  const box=document.getElementById("buttons");
  const msg=document.getElementById("message");

  msg.textContent = messages[tries % messages.length];
  b.textContent = noTexts[tries % noTexts.length];

  const rangeX=Math.max(90,(box.clientWidth-b.offsetWidth)/2);
  const x=(Math.random()*2-1)*rangeX;
  const y=(Math.random()*80)-40;
  const rot=(Math.random()*30)-15;
  const scale=Math.max(0.55,1-tries*0.06);

  b.style.transform=`translate(${x}px,${y}px) rotate(${rot}deg) scale(${scale})`;
  b.style.transition="transform .18s ease";

  // playful screen shake
  document.querySelector('.card').animate([
    {transform:'translateX(0)'},
    {transform:'translateX(-3px)'},
    {transform:'translateX(3px)'},
    {transform:'translateX(0)'}
  ],{duration:120});

  // confetti emoji burst
  for(let i=0;i<6;i++){
    const s=document.createElement('div');
    s.textContent=['✨','😂','🏸','💚','😜','🎉'][Math.floor(Math.random()*6)];
    s.style.position='fixed';
    s.style.left=(e.touches?e.touches[0].clientX:e.clientX)+'px';
    s.style.top=(e.touches?e.touches[0].clientY:e.clientY)+'px';
    s.style.pointerEvents='none';
    s.style.fontSize=(18+Math.random()*18)+'px';
    s.style.zIndex=9999;
    document.body.appendChild(s);
    s.animate([
      {transform:'translate(0,0) scale(1)',opacity:1},
      {transform:`translate(${(Math.random()*140)-70}px,${-60-Math.random()*80}px) scale(1.6)`,opacity:0}
    ],{duration:700,easing:'ease-out'}).onfinish=()=>s.remove();
  }

  tries++;

  if(tries>8){
    b.style.opacity=0;
    b.style.pointerEvents='none';
    msg.textContent="Fine... destiny has chosen YES for you 😌💕";
    setTimeout(()=>showDates(),700);
  }
}
function showDates(){
  page1.classList.add("hidden"); page2.classList.remove("hidden");
}
function chooseDate(d){
  const phone = "6581664942";
  const text = encodeURIComponent(
    `Hi! I choose ${d} 2026 for our JB badminton + food date 🏸🍜🇲🇾`
  );

  // Open WhatsApp with a pre-filled message to your number
  window.open(`https://wa.me/${phone}?text=${text}`, "_blank");

  // Show the confirmation page as well
  page2.classList.add("hidden");
  page3.classList.remove("hidden");
  document.getElementById("selected").textContent =
    "You picked Sunday, " + d + " 2026.";
}
function backHome(){
  page2.classList.add("hidden"); page3.classList.add("hidden"); page1.classList.remove("hidden");
  document.getElementById("noBtn").style.transform="none";
  document.getElementById("message").textContent="";
  tries=0;
}
</script>
</body>
</html>
